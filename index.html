  html += '<div class="filter-bar" id="diaryFilter"><button class="chip" data-h="all" aria-pressed="true">Todos os hábitos</button>';
  BOOK.habits.forEach(function(h){ html += '<button class="chip" data-h="'+h.id+'" aria-pressed="false">Háb. '+h.number+'</button>'; });
  html += '</div>';
  html += '<div class="filter-bar"><select id="periodFilter" style="max-width:170px;"><option value="all">Todo o período</option><option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="month">Este mês</option></select>';
  html += '<span class="muted" style="font-size:.78rem;">Livro: '+BOOK.title.slice(0,26)+'…</span></div>';
  html += '<div class="timeline" id="diaryList"></div>';
  c.innerHTML = html;
  document.getElementById("newDiary").addEventListener("click", function(){ openExperienceWizard(null, function(){ go("diario"); }); });
  var activeHabit = "all", activePeriod = "all";
  function repaint(){ paintDiary(activeHabit, activePeriod); }
  repaint();
  document.getElementById("periodFilter").addEventListener("change", function(e){ activePeriod = e.target.value; repaint(); });
  c.querySelectorAll("#diaryFilter [data-h]").forEach(function(chip){
    chip.addEventListener("click", function(){ c.querySelectorAll("#diaryFilter [data-h]").forEach(function(x){ x.setAttribute("aria-pressed", x===chip); }); activeHabit = chip.dataset.h; repaint(); });
  });
}
function withinPeriod(dateStr, period){
  if(period==="all" || !dateStr) return true;
  var d = new Date(dateStr+"T00:00:00"), now = new Date();
  if(period==="7") return (now-d)/86400000 <= 7;
  if(period==="30") return (now-d)/86400000 <= 30;
  if(period==="month") return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  return true;
}
var lastDiaryFilter = {h:"all", p:"all"};
function paintDiary(habitFilter, period){
  lastDiaryFilter = {h:habitFilter, p:period};
  var list = document.getElementById("diaryList");
  var entries = (store.diary||[]).filter(function(e){
    var okHabit = habitFilter==="all" || (e.habits||[]).indexOf(habitFilter)>-1;
    return okHabit && withinPeriod(e.date, period);
  }).sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
  if(!entries.length){ list.innerHTML = '<p class="empty-note">Nenhum registro encontrado.</p>'; return; }
  list.innerHTML = entries.map(function(e){
    var hs = (e.habits||[]).map(function(hid){ var h=BOOK.habits.find(function(x){return x.id===hid;}); return h ? ("Hábito "+h.number+" · "+h.title.split(" ").slice(0,2).join(" ")) : ""; }).filter(Boolean).join(" + ");
    var quote = e.revelou || e.situacao || "";
    return '<div class="tl-entry"><span class="tl-date">'+formatDate(e.date)+'</span><div class="tl-body">'+
      '<span class="tl-tag">'+hs+'</span>'+
      '<p class="tl-quote">"'+esc(quote.slice(0,140))+(quote.length>140?"…":"")+'"</p>'+
      '<div class="tl-actions"><button data-read="'+e.id+'">Ler</button><button data-edit="'+e.id+'">Editar</button><button data-del="'+e.id+'">Excluir</button></div></div></div>';
  }).join('');
  list.querySelectorAll("[data-read]").forEach(function(b){ b.addEventListener("click", function(){ openReadEntryModal(b.dataset.read); }); });
  list.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click", function(){ openEditEntryModal(b.dataset.edit); }); });
  list.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", function(){ store.diary = store.diary.filter(function(e){return e.id!==b.dataset.del;}); saveStore(); paintDiary(lastDiaryFilter.h, lastDiaryFilter.p); }); });
}
function refreshAfterEntryChange(){
  if(state.route==="diario") paintDiary(lastDiaryFilter.h, lastDiaryFilter.p); else renderApp();
}
function openReadEntryModal(entryId){
  var e = (store.diary||[]).find(function(x){return x.id===entryId;});
  if(!e) return;
  var m = e.missionId ? missionById(e.missionId) : null;
  var body = '<div class="stack">';
  if(m){ body += '<p class="callout"><b>Lição</b>'+m.name+'</p>'; }
  if(e.respostas){
    if(e.sentimento) body += '<p class="tl-tag">Como foi: '+e.sentimento+'</p>';
    e.respostas.filter(function(r){ return r.a; }).forEach(function(r){ body += '<div><p class="eyebrow" style="margin-bottom:4px;">'+esc(r.q)+'</p><p style="line-height:1.55;">'+esc(r.a)+'</p></div>'; });
  } else {
    (e.quick ? QUICK_STEPS : WIZ_STEPS).forEach(function(step){ if(e[step.key]) body += '<div><p class="eyebrow" style="margin-bottom:4px;">'+step.q+'</p><p style="line-height:1.55;">'+esc(e[step.key])+'</p></div>'; });
  }
  body += '<div class="rem-actions"><button class="btn primary" id="editEntryBtn">Editar relato</button><button class="btn ghost" id="readClose">Fechar</button></div>';
  body += '</div>';
  openModal(formatDate(e.date), body);
  document.getElementById("readClose").addEventListener("click", function(){ closeModal(); });
  document.getElementById("editEntryBtn").addEventListener("click", function(){ openEditEntryModal(entryId); });
}
function openEditEntryModal(entryId){
  var e = (store.diary||[]).find(function(x){return x.id===entryId;});
  if(!e) return;
  var m = e.missionId ? missionById(e.missionId) : null;
  var fields = [];
  if(e.respostas){
    var qs = (m && m.perguntas) ? m.perguntas : e.respostas.map(function(r){ return r.q; });
    fields = qs.map(function(q, i){ var old = e.respostas.find(function(r){ return r.q===q; }) || e.respostas[i] || {}; return {q:q, a:old.a||""}; });
  } else {
    fields = (e.quick ? QUICK_STEPS : WIZ_STEPS).map(function(step){ return {q:step.q, key:step.key, a:e[step.key]||""}; });
  }
  var feeling = e.sentimento || "";
  var body = '<div class="stack">';
  if(m){ body += '<p class="callout"><b>Lição</b>'+m.name+'</p>'; }
  fields.forEach(function(f, i){ body += '<label class="field">'+esc(f.q)+'<textarea id="edQ'+i+'">'+esc(f.a)+'</textarea></label>'; });
  body += '<p class="mic-hint">🎤 Prefere falar? Toque no microfone do teclado e fale.</p>';
  if(e.respostas){
    body += '<div><p class="field" style="margin-bottom:8px;">Como foi para você?</p><div class="chip-group" id="edFeel">'+SENTIMENTOS.map(function(f){ return '<button type="button" class="chip" data-f="'+f+'" aria-pressed="'+(f===feeling)+'">'+f+'</button>'; }).join('')+'</div></div>';
  }
  body += '<p class="st-error" id="edError" hidden>Deixe pelo menos uma resposta preenchida. Para apagar o relato inteiro, use Excluir no Diário.</p>';
  body += '<div class="rem-actions"><button class="btn primary" id="edSave">Salvar alterações</button><button class="btn ghost" id="edCancel">Cancelar</button></div>';
  body += '<p class="muted" style="font-size:.76rem;">A data e o progresso do relato continuam os mesmos.</p></div>';
  openModal("Editar relato", body);
  document.querySelectorAll("#edFeel [data-f]").forEach(function(b){
    b.addEventListener("click", function(){
      feeling = (feeling === b.dataset.f) ? "" : b.dataset.f;
      document.querySelectorAll("#edFeel [data-f]").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.f===feeling); });
    });
  });
  document.getElementById("edCancel").addEventListener("click", function(){ openReadEntryModal(entryId); });
  document.getElementById("edSave").addEventListener("click", function(){
    var vals = fields.map(function(f, i){ return (val("edQ"+i)||"").trim(); });
    if(!vals.some(function(v){ return v; })){ document.getElementById("edError").hidden = false; return; }
    if(e.respostas){
      e.respostas = fields.map(function(f, i){ return {q:f.q, a:vals[i]}; });
      var filled = e.respostas.filter(function(r){ return r.a; });
      e.situacao = filled[0].a; e.revelou = filled[filled.length-1].a;
      e.sentimento = feeling;
    } else {
      fields.forEach(function(f, i){ e[f.key] = vals[i]; });
    }
    e.editedAt = new Date().toISOString();
    saveStore(); closeModal(); refreshAfterEntryChange();
    showToast("Relato atualizado");
  });
}

  document.body.appendChild(t); setTimeout(function(){ t.classList.add("out"); }, 1800); setTimeout(function(){ t.remove(); }, 2300);
}

  html += '<div class="jr-stats">';
  [[lessonsDone, lessonsDone===1?"lição vivida":"lições vividas"], [currentStreak(), currentStreak()===1?"semana seguida":"semanas seguidas"], [toTuesday, toTuesday===1?"relato para terça":"relatos para terça"]].forEach(function(x){ html += '<div class="jr-stat"><span class="jr-n">'+x[0]+'</span><span class="jr-l">'+x[1]+'</span></div>'; });
  html += '</div>';
  var feels = {}; (store.diary||[]).forEach(function(e){ if(e.sentimento) feels[e.sentimento] = (feels[e.sentimento]||0)+1; });
  var maxF = Math.max.apply(null, SENTIMENTOS.map(function(f){ return feels[f]||0; }).concat([1]));
  html += '<div class="jr-feels"><p class="eyebrow">Como têm sido as lições</p>';
  if(!Object.keys(feels).length){ html += '<p class="muted" style="font-size:.84rem;">Aparece aqui depois do seu primeiro "Contar como foi".</p>'; }
  else { SENTIMENTOS.forEach(function(f){ var n = feels[f]||0; html += '<div class="jr-feel"><span class="jr-feel-l">'+f+'</span><span class="jr-bar"><i style="width:'+Math.round(n/maxF*100)+'%"></i></span><span class="jr-feel-n">'+n+'</span></div>'; }); }
  html += '</div></div>';

  html += '<div class="panel" style="margin-bottom:16px;">';
  [["Livro atual", BOOK.title], ["Minha leitura", (store.myPage||0)+" / "+BOOK.totalPages+" páginas"],
   ["Relatos no diário", diaryCount],
   ["Casos gerenciais respondidos", casesCount+" / "+BOOK.cases.length], ["Encontros do círculo", meetingsCount], ["Semanas seguidas registrando", currentStreak() ? "🔥 "+currentStreak() : "—"]].forEach(function(pair){
    html += '<div class="kv-row"><span class="k">'+pair[0]+'</span><span class="v">'+pair[1]+'</span></div>';
  });
  html += '</div>';

  html += '<div class="panel" style="margin-bottom:16px;">';
  html += '  <p class="eyebrow" style="margin-bottom:10px;">Marcos da jornada</p>';
  var milestones = milestoneList().map(function(x){ return [x.t, x.ok]; });
  milestones.forEach(function(ms){ html += '<div class="kv-row"><span class="k" style="'+(ms[1]?'color:var(--ink);':'')+'">'+ms[0]+'</span><span class="v" style="'+(ms[1]?'color:var(--gold);':'color:var(--ink-muted);font-weight:400;')+'">'+(ms[1]?"Alcançado":"—")+'</span></div>'; });
  html += '</div>';

  var lb = lookbackEntry();
  if(lb){
    html += '<div class="section-title"><span class="eyebrow">Olhando para trás</span></div>';
    html += '<div class="lookback"><p class="lb-when">'+lb.when+'</p><p style="line-height:1.55;">"'+esc(lb.text)+'"</p><p class="lb-q">Você ainda pensa dessa forma? O que mudou desde então?</p></div>';
  }

  c.innerHTML = html;
}
function lookbackEntry(){
  var pool = (store.diary||[]).filter(function(e){return e.revelou || e.situacao;}).map(function(e){ return {date:e.date, text: e.revelou || e.situacao}; });
  pool = pool.filter(function(p){return p.date;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!pool.length) return null;
  var p = pool[0];
  var days = Math.round((Date.now() - new Date(p.date+"T00:00:00").getTime())/86400000);
  var when;
  if(days < 14) when = "Há "+Math.max(days,1)+" dia(s), você registrou:";
  else if(days < 60) when = "Há "+Math.round(days/7)+" semanas, você registrou:";
  else when = "Há "+Math.round(days/30)+" meses, você registrou:";
  return {when:when, text:p.text};
}

/* ============================= MODAL ============================= */
function openModal(title, bodyHtml){
  var root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="modal-overlay" id="ovl"><div class="modal"><div class="modal-head"><h3 style="margin:0;font-size:1.04rem;">'+title+'</h3><button class="modal-close" id="modalX">'+ICONS.close+'</button></div>'+bodyHtml+'</div></div>';
  document.getElementById("modalX").addEventListener("click", closeModal);
  document.getElementById("ovl").addEventListener("click", function(e){ if(e.target.id==="ovl") closeModal(); });
}
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

/* ============================= BOOT ============================= */
function boot(data){
  if(data && data.store){ store = data.store; }
  if(!store) store = loadStore();
  initCelebrated();
  renderApp();
}
function snapshot(){ return { store: store }; }
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(snapshot);
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
} else {
  boot({});
}
})();
</script>
