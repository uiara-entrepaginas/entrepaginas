<style>
  :root{
    --bg:#F3F1E9;
    --surface:#FFFFFF;
    --surface-2:#E9E4D6;
    --ink:#272B23;
    --ink-muted:#5C604F;
    --accent:#5C7156;
    --accent-deep:#2E4029;
    --accent-soft:#E1E7D8;
    --on-accent:#FFFFFF;
    --gold-cta:#CFAE63;
    --on-gold:#1E2119;
    --gold:#7C642E;
    --gold-soft:#EFE7D3;
    --line:#DCD7C6;
    --shadow: 0 1px 2px rgba(35,40,30,.05), 0 10px 26px -14px rgba(35,40,30,.16);
    --radius: 14px;
    --nav-h: 58px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161811; --surface:#1E2119; --surface-2:#272A20;
      --ink:#E9E6D8; --ink-muted:#A3A18E;
      --accent:#8FA382; --accent-deep:#C4D6BA; --accent-soft:#2A3425; --on-accent:#161811;
      --gold:#C9AD6E; --gold-soft:#382F1F;
      --line:#36392D;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161811; --surface:#1E2119; --surface-2:#272A20;
    --ink:#E9E6D8; --ink-muted:#A3A18E;
    --accent:#8FA382; --accent-deep:#C4D6BA; --accent-soft:#2A3425; --on-accent:#161811;
    --gold:#C9AD6E; --gold-soft:#382F1F;
    --line:#36392D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--ink); font-family:"Libre Franklin", ui-sans-serif, system-ui, sans-serif; padding:0; margin:0; }
  h1,h2,h3,h4,.display{ font-family:"Fraunces", Georgia, serif; font-weight:600; text-wrap:balance; letter-spacing:-.01em; }
  p{ margin:0; }
  button{ font-family:inherit; }
  .eyebrow{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-deep); font-weight:600; }
  .eyebrow.gold{ color:var(--gold); }
  .muted{ color:var(--ink-muted); }
  [hidden]{ display:none !important; }
  .icon{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  .signature{ font-family:"Fraunces",serif; font-style:italic; color:var(--accent-deep); }

  /* ---------------- brand mark: open book + arc of seven ---------------- */
  .mark{ display:inline-flex; align-items:center; gap:9px; }
  .mk-dot{ fill:var(--accent); }
  .mk-dot.center{ fill:var(--gold); }
  .mk-book{ fill:none; stroke:var(--accent-deep); stroke-width:1.6; stroke-linejoin:round; }
  .mk-spine{ stroke:var(--accent-deep); stroke-width:1.2; }
  .wordmark{ font-family:"Fraunces",serif; font-weight:600; letter-spacing:.02em; }

  /* ---------------- shell ---------------- */
  .shell{ display:grid; grid-template-columns:222px 1fr; min-height:100%; }
  @media (max-width:900px){ .shell{ grid-template-columns:minmax(0,1fr); } }
  .shell > div{ min-width:0; }
  .content{ overflow-wrap:anywhere; }
  .sidebar{ background:var(--surface); border-right:1px solid var(--line); padding:26px 16px; display:flex; flex-direction:column; gap:26px; position:sticky; top:0; height:100vh; }
  @media (max-width:900px){ .sidebar{ display:none; } }
  .brand-block{ display:flex; flex-direction:column; gap:8px; }
  .brand-block .wordmark{ font-size:1.08rem; }
  .brand-block .sub{ font-size:.7rem; color:var(--ink-muted); letter-spacing:.03em; }
  .nav-list{ display:flex; flex-direction:column; gap:3px; }
  .nav-item{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; background:none; border:none; color:var(--ink-muted); font:600 .85rem "Libre Franklin",sans-serif; cursor:pointer; text-align:left; width:100%; }
  .nav-item[aria-current="true"]{ background:var(--accent-soft); color:var(--accent-deep); }

  .mobile-top{ display:none; position:sticky; top:0; z-index:15; background:var(--surface); border-bottom:1px solid var(--line);
    padding: max(10px, env(safe-area-inset-top,0px)) 16px 10px; align-items:center; gap:9px; }
  @media (max-width:900px){ .mobile-top{ display:flex; } }

  .content{ padding: max(18px, env(safe-area-inset-top,0px)) 16px calc(var(--nav-h) + 26px); max-width:840px; width:100%; margin:0 auto; }
  @media (min-width:900px){ .content{ padding: 30px 32px 44px; } }
  @media (max-width:900px){ .content{ padding-top:16px; } }

  .bottomnav{ position:fixed; left:0; right:0; bottom:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); background:var(--surface); border-top:1px solid var(--line); display:flex; z-index:20; }
  @media (min-width:900px){ .bottomnav{ display:none; } }
  .bn-item{ flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--ink-muted); font:600 .68rem "Libre Franklin",sans-serif; cursor:pointer; }
  .bn-item[aria-current="true"]{ color:var(--accent-deep); }

  /* ---------------- generic ---------------- */
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; }
  .stack{ display:flex; flex-direction:column; gap:16px; }
  .back{ background:none; border:none; color:var(--ink-muted); font:600 .81rem "Libre Franklin",sans-serif; cursor:pointer; display:flex; align-items:center; gap:6px; padding:0; margin-bottom:14px; }
  .back:hover{ color:var(--ink); }
  .pill{ font-size:.68rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:999px; display:inline-block; }
  .pill.reading{ background:var(--gold-soft); color:var(--gold); }
  .pill.done{ background:var(--accent-soft); color:var(--accent-deep); }
  .pill.queued{ background:var(--surface-2); color:var(--ink-muted); }
  .progress-track{ height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .progress-track > i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease; }
  .btn{ border:none; border-radius:10px; padding:11px 18px; font:600 .85rem "Libre Franklin",sans-serif; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .btn.primary{ background:var(--accent-deep); color:var(--on-accent); }
  a.btn{ text-decoration:none; }
  .btn.ghost{ background:var(--surface-2); color:var(--ink); }
  .btn.link{ background:none; color:var(--accent-deep); padding:6px 0; }
  .btn.sm{ padding:8px 13px; font-size:.79rem; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  label.field{ display:flex; flex-direction:column; gap:6px; font-size:.8rem; font-weight:600; color:var(--ink-muted); }
  input[type=text], input[type=date], input[type=number], textarea, select{ font:400 .92rem "Libre Franklin",sans-serif; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; }
  textarea{ min-height:96px; resize:vertical; }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .checkline{ display:flex; align-items:center; gap:9px; font-size:.85rem; }
  .checkline input{ width:17px; height:17px; accent-color:var(--accent-deep); }

  .chip-group{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{ border:1px solid var(--line); background:var(--surface); color:var(--ink-muted); border-radius:999px; padding:6px 12px; font:600 .77rem "Libre Franklin",sans-serif; cursor:pointer; }
  .chip[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-deep); }

  /* ---------------- book cover ---------------- */
  .cover{ aspect-ratio:2/3; border-radius:6px; box-shadow:0 6px 18px -8px rgba(20,25,15,.35); position:relative; overflow:hidden; flex:0 0 auto; background:var(--surface-2); }
  img.cover{ object-fit:cover; object-position:center; display:block; }
  .cover.ph{ background:linear-gradient(160deg,var(--accent-deep),color-mix(in srgb, var(--accent-deep) 75%, black)); display:flex; flex-direction:column; justify-content:space-between; padding:10%; color:#EFEAD8; }
  .cover.ph::after{ content:""; position:absolute; inset:0; background:linear-gradient(100deg, rgba(255,255,255,.08), transparent 40%); }
  .cover.ph .ct{ font-family:"Fraunces",serif; font-weight:600; line-height:1.15; position:relative; z-index:1; }
  .cover.ph .ca{ font-size:.72em; opacity:.85; position:relative; z-index:1; }
  .cover.ph .cmark{ position:relative; z-index:1; opacity:.9; }
  .cover.sm{ width:64px; }
  .cover.md{ width:104px; }
  .cover.lg{ width:150px; }
  .cover.queued-slot{ background:none; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-muted); box-shadow:none; }

  /* ---------------- home ---------------- */
  .home-header{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin-bottom:26px; }
  .home-header .wordmark{ font-size:1.5rem; }
  .home-header .sub{ font-size:.82rem; color:var(--ink-muted); }
  .home-header .tag{ font-size:.95rem; margin-top:4px; }
  .about-btn{ display:inline-flex; align-items:center; gap:8px; width:fit-content; min-height:44px; border-radius:999px; border:none; background:var(--gold-cta); color:var(--on-gold); cursor:pointer; padding:11px 20px 11px 16px; margin-top:14px; font:700 .9rem "Libre Franklin",sans-serif; box-shadow:0 6px 16px -8px rgba(124,100,46,.6); transition:transform .15s ease, filter .15s ease; }
  .about-btn .icon{ width:19px; height:19px; stroke-width:2; }
  .about-btn:hover{ filter:brightness(1.05); }
  .about-btn:active{ transform:scale(.98); }
  .about-btn:focus-visible{ outline:2px solid var(--accent-deep); outline-offset:3px; }
  .reflex{ display:flex; flex-direction:column; gap:8px; padding:4px 0 4px 16px; border-left:2px solid var(--gold); margin:0 0 26px; }
  .reflex-text{ font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:1.08rem; line-height:1.55; color:var(--ink); max-width:46ch; }
  .nudge{ position:relative; background:linear-gradient(150deg, var(--gold-soft), var(--surface)); border:1px solid var(--gold); border-radius:var(--radius); padding:18px 18px 16px; margin-bottom:24px; display:flex; flex-direction:column; gap:8px; }
  .nudge .n-msg{ font-family:"Fraunces",serif; font-style:italic; font-size:1.02rem; line-height:1.5; color:var(--ink); }
  .nudge .n-task{ font-size:.85rem; color:var(--ink-muted); line-height:1.45; }
  .nudge .n-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
  .cel-ovl{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(20,22,16,.28); animation:celFade .3s ease both; }
  .cel-card{ position:relative; overflow:hidden; width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:0 24px 60px -20px rgba(20,25,15,.45); padding:30px 24px 24px; text-align:center; animation:celPop .45s cubic-bezier(.2,.9,.3,1.2) both; }
  .cel-card.big{ border-color:var(--gold); background:linear-gradient(170deg, var(--gold-soft), var(--surface) 60%); }
  .cel-card.small{ max-width:320px; padding:22px 20px 18px; }
  .cel-icon{ width:58px; height:58px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-deep); position:relative; z-index:1; }
  .cel-card.big .cel-icon{ width:74px; height:74px; background:radial-gradient(circle at 35% 30%, #F3E3B5, var(--gold)); color:#fff; box-shadow:0 0 0 6px var(--gold-soft), 0 10px 24px -8px rgba(156,130,72,.6); }
  .cel-icon svg{ width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .cel-card.big .cel-icon svg{ width:34px; height:34px; }
  .cel-eyebrow{ font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:6px; position:relative; z-index:1; }
  .cel-title{ font-family:"Fraunces",serif; font-weight:600; font-size:1.25rem; line-height:1.25; color:var(--ink); margin:0 0 8px; position:relative; z-index:1; }
  .cel-msg{ font-family:"Fraunces",serif; font-style:italic; font-size:.98rem; line-height:1.5; color:var(--ink-muted); position:relative; z-index:1; }
  .cel-streak{ display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:6px 13px; border-radius:999px; background:var(--gold-soft); color:var(--gold); font:700 .78rem "Libre Franklin",sans-serif; position:relative; z-index:1; }
  .cel-tap{ margin-top:16px; font-size:.7rem; color:var(--ink-muted); opacity:.7; position:relative; z-index:1; }
  .cel-leaf{ position:absolute; bottom:-24px; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px 1px color-mix(in srgb, var(--gold) 55%, transparent); opacity:0; animation:celRise 2.6s ease-out forwards; }
  .cel-leaf.p{ width:5px; height:5px; background:var(--accent); box-shadow:none; }
  .cel-leaf.g{ width:9px; height:9px; }
  @keyframes celFade{ from{opacity:0} to{opacity:1} }
  @keyframes celPop{ from{opacity:0; transform:translateY(14px) scale(.94)} to{opacity:1; transform:none} }
  @keyframes celRise{ 0%{opacity:0; transform:translateY(0) rotate(0)} 15%{opacity:.85} 100%{opacity:0; transform:translateY(-300px) translateX(var(--dx)) rotate(var(--rot))} }
  @media (prefers-reduced-motion: reduce){ .cel-ovl,.cel-card{ animation:none; } .cel-leaf{ display:none; } }
  /* comemoração de prática com o ícone original */
  .ci-ovl{ background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); flex-direction:column; animation:celFade .4s ease both; }
  .ci-stage{ position:relative; display:flex; flex-direction:column; align-items:center; gap:22px; max-width:340px; width:100%; text-align:center; }
  .ci-icon{ position:relative; width:148px; height:148px; border-radius:24%; overflow:hidden; z-index:1;
    box-shadow:0 18px 40px -18px rgba(20,30,15,.55);
    animation:ciIn .7s cubic-bezier(.2,.8,.3,1) both, ciGlow 3s ease-in-out both; }
  .ci-icon img{ width:100%; height:100%; display:block; object-fit:cover; }
  .ci-icon.noimg{ background:radial-gradient(circle at 50% 70%, #E7CF8E, #2E4029 70%); }
  .ci-book, .ci-travel, .ci-sheen{ position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; }
  .ci-book{ background:radial-gradient(ellipse 46% 26% at 50% 68%, rgba(255,226,150,.95), rgba(255,206,110,.35) 55%, transparent 75%); opacity:0; animation:ciBook 3s ease-in-out both; }
  .ci-travel{ background:radial-gradient(ellipse 40% 22% at 50% 50%, rgba(255,236,180,.9), rgba(255,210,120,.25) 60%, transparent 80%); opacity:0; animation:ciTravel 3s ease-in-out both; }
  .ci-sheen{ background:linear-gradient(115deg, transparent 35%, rgba(255,246,214,.55) 50%, transparent 65%); background-size:250% 100%; background-position:120% 0; opacity:0; animation:ciSheen 3s ease-in-out both; }
  .ci-halo{ position:absolute; top:74px; left:50%; width:230px; height:230px; margin:-115px 0 0 -115px; border-radius:50%; background:radial-gradient(circle, rgba(214,180,100,.55), rgba(214,180,100,0) 65%); opacity:0; animation:ciHalo 3s ease-in-out both; }
  .ci-ring{ position:absolute; top:74px; left:50%; width:170px; height:170px; margin:-85px 0 0 -85px; border-radius:50%; border:1px solid rgba(201,173,110,.7); opacity:0; }
  .ci-stage.deep .ci-ring{ animation:ciRing 2.4s ease-out 1.6s both; }
  .ci-stage.deep .ci-halo{ animation:ciHaloDeep 3.2s ease-in-out both; }
  .ci-stage.deep .ci-icon{ animation:ciIn .7s cubic-bezier(.2,.8,.3,1) both, ciGlowDeep 3.2s ease-in-out both; }
  .ci-text{ display:flex; flex-direction:column; align-items:center; gap:6px; opacity:0; animation:ciText .8s ease 1.7s both; }
  .ci-eyebrow{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .ci-title{ font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.55rem; line-height:1.2; margin:0; color:var(--ink); }
  .ci-count{ display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--ink-muted); }
  .ci-dots{ display:inline-flex; gap:4px; }
  .ci-dots i{ width:7px; height:7px; border-radius:50%; border:1px solid var(--gold); display:inline-block; }
  .ci-dots i.on{ background:var(--gold); }
  .ci-msg{ font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:1rem; line-height:1.5; color:var(--ink-muted); max-width:30ch; margin-top:4px; }
  .ci-extra{ font-size:.76rem; font-weight:600; color:var(--accent-deep); margin-top:4px; }
  .ci-text .cel-tap{ margin-top:10px; }
  @keyframes ciIn{ from{ opacity:0; transform:scale(.86) translateY(8px); } to{ opacity:1; transform:none; } }
  @keyframes ciBook{ 0%,15%{ opacity:0; } 35%{ opacity:1; } 70%{ opacity:.55; } 100%{ opacity:.35; } }
  @keyframes ciTravel{ 0%,28%{ opacity:0; transform:translateY(18%); } 40%{ opacity:.95; transform:translateY(14%); } 72%{ opacity:.85; transform:translateY(-26%); } 100%{ opacity:0; transform:translateY(-32%); } }
  @keyframes ciSheen{ 0%,62%{ opacity:0; background-position:120% 0; } 70%{ opacity:1; } 90%{ opacity:.8; background-position:-20% 0; } 100%{ opacity:0; background-position:-20% 0; } }
  @keyframes ciGlow{ 0%,60%{ filter:brightness(1); box-shadow:0 18px 40px -18px rgba(20,30,15,.55); } 78%{ filter:brightness(1.14) saturate(1.08); box-shadow:0 0 34px 6px rgba(214,180,100,.55), 0 18px 40px -18px rgba(20,30,15,.55); } 100%{ filter:brightness(1.05); box-shadow:0 0 18px 2px rgba(214,180,100,.3), 0 18px 40px -18px rgba(20,30,15,.55); } }
  @keyframes ciGlowDeep{ 0%,55%{ filter:brightness(1); } 75%{ filter:brightness(1.24) saturate(1.12); box-shadow:0 0 54px 14px rgba(214,180,100,.7), 0 18px 40px -18px rgba(20,30,15,.55); } 100%{ filter:brightness(1.1); box-shadow:0 0 30px 6px rgba(214,180,100,.45), 0 18px 40px -18px rgba(20,30,15,.55); } }
  @keyframes ciHalo{ 0%,50%{ opacity:0; transform:scale(.8); } 80%{ opacity:.9; transform:scale(1); } 100%{ opacity:.55; transform:scale(1); } }
  @keyframes ciHaloDeep{ 0%,45%{ opacity:0; transform:scale(.8); } 75%{ opacity:1; transform:scale(1.15); } 100%{ opacity:.75; transform:scale(1.1); } }
  @keyframes ciRing{ from{ opacity:.8; transform:scale(.9); } to{ opacity:0; transform:scale(1.7); } }
  @keyframes ciText{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .ci-ovl, .ci-icon, .ci-stage.deep .ci-icon, .ci-text, .ci-halo, .ci-stage.deep .ci-halo, .ci-ring, .ci-stage.deep .ci-ring, .ci-book, .ci-travel, .ci-sheen{ animation:none !important; }
    .ci-text, .ci-halo{ opacity:1; } .ci-book{ opacity:.4; }
    .ci-icon{ box-shadow:0 0 28px 4px rgba(214,180,100,.45); }
  }
  .toast{ position:fixed; left:50%; bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:70; background:var(--accent-deep); color:var(--surface); font:600 .84rem "Libre Franklin",sans-serif; padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); transition:opacity .4s ease; }
  .toast.out{ opacity:0; }
  .warn-wrap{ max-width:840px; margin:0 auto; padding:16px 16px 0; }

  .enc-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin:18px 0 8px; }

  .enc-link{ background:none; border:none; padding:2px 0; cursor:pointer; color:var(--gold); font:600 .74rem "Libre Franklin",sans-serif; text-decoration:underline; text-underline-offset:3px; }
  .enc-link:focus-visible, .chip:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .lab-hero{ margin-bottom:22px; }
  .lab-hero h1{ font-size:1.5rem; margin-bottom:2px; }
  .locked-panel{ display:flex; flex-direction:column; }
  .locked-panel .lp-title{ font-family:"Fraunces",serif; font-size:1.15rem; color:var(--accent-deep); margin:8px 0 10px; line-height:1.4; }
  .locked-panel .lp-text{ font-size:.9rem; line-height:1.65; color:var(--ink-muted); }

  .mission-path{ position:relative; padding-left:24px; display:flex; flex-direction:column; gap:9px; }
  .mission-path::before{ content:""; position:absolute; left:8px; top:6px; bottom:6px; width:1.5px; background:var(--line); }
  .path-item{ position:relative; }
  .path-item::before{ content:""; position:absolute; left:-24px; top:15px; width:9px; height:9px; border-radius:50%; background:var(--surface); border:2px solid var(--line); }
  .path-item.done::before{ border-color:var(--accent); background:var(--accent); }

  .mission-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 15px; display:flex; flex-direction:column; gap:5px; cursor:pointer; text-align:left; font-family:inherit; color:inherit; width:100%; }
  .mission-card .top-row{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .mission-card .m-num{ font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--ink-muted); }
  .mission-card .m-title{ font-weight:600; font-size:.94rem; }
  .status-tag{ font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:999px; flex:0 0 auto; }
  .status-tag.n{ background:var(--surface-2); color:var(--ink-muted); }
  .status-tag.done{ background:var(--accent-soft); color:var(--accent-deep); }

  .callout{ background:var(--surface-2); border-left:3px solid var(--accent); border-radius:8px; padding:14px 16px; }
  .callout.gold{ border-left-color:var(--gold); }
  .callout b{ font-family:"Fraunces",serif; font-weight:600; color:var(--accent-deep); display:block; margin-bottom:3px; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; }
  .callout.gold b{ color:var(--gold); }

  .filter-bar{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; align-items:center; }
  .filter-bar .chip{ flex:0 0 auto; white-space:nowrap; overflow-wrap:normal; }
  .final-card{ background:linear-gradient(150deg, var(--accent-soft), var(--surface)); border:1px solid var(--accent); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:10px; }

  /* ---------------- timelines ---------------- */
  .timeline{ display:flex; flex-direction:column; gap:2px; }
  .tl-entry{ display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
  .tl-date{ font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-muted); flex:0 0 52px; padding-top:2px; text-transform:uppercase; }
  .tl-body{ flex:1; display:flex; flex-direction:column; gap:5px; }
  .tl-tag{ font-size:.72rem; font-weight:700; color:var(--accent-deep); }
  .tl-quote{ font-family:"Fraunces",serif; font-style:italic; font-size:.92rem; line-height:1.5; color:var(--ink); }
  .tl-actions{ display:flex; gap:14px; align-items:center; }
  .tl-actions button{ background:none; border:none; padding:0; font:600 .74rem "Libre Franklin",sans-serif; color:var(--ink-muted); cursor:pointer; }
  .tl-actions button:hover{ color:var(--accent-deep); }
  .share-flag{ font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--gold); }

  /* ---------------- jornada ---------------- */
  .kv-row{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.88rem; }
  .kv-row:last-child{ border-bottom:none; }
  .kv-row .k{ color:var(--ink-muted); }
  .kv-row .v{ font-weight:600; text-align:right; }
  .lookback{ background:var(--surface-2); border-radius:12px; padding:16px 18px; }
  .lookback .lb-when{ font-size:.72rem; color:var(--ink-muted); margin-bottom:6px; }
  .lookback .lb-q{ font-size:.82rem; color:var(--accent-deep); font-weight:600; margin-top:10px; }

  /* ---------------- wizard ---------------- */
  .wiz-progress{ display:flex; gap:4px; margin-bottom:16px; }
  .wiz-progress i{ flex:1; height:3px; border-radius:2px; background:var(--surface-2); }
  .wiz-progress i.on{ background:var(--accent); }
  .wiz-step-label{ font-size:.72rem; color:var(--ink-muted); margin-bottom:4px; }
  .wiz-nav{ display:flex; justify-content:space-between; margin-top:18px; gap:10px; }

  /* ---------------- presentation (modo encontro) ---------------- */
  .presentation{ display:flex; flex-direction:column; gap:22px; }
  .presentation .mark{ justify-content:center; }
  .presentation .quote{ font-family:"Fraunces",serif; font-style:italic; font-size:1.1rem; line-height:1.55; color:var(--accent-deep); text-align:center; max-width:50ch; margin:0 auto; }
  .discuss-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .discuss-list li{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:.9rem; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(20,22,16,.45); display:flex; align-items:flex-end; justify-content:center; z-index:40; }
  @media (min-width:640px){ .modal-overlay{ align-items:center; } }
  .modal{ background:var(--surface); border-radius:16px 16px 0 0; width:100%; max-width:540px; max-height:88vh; overflow-y:auto; padding:22px; }
  @media (min-width:640px){ .modal{ border-radius:16px; } }
  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:10px; }
  .modal-close{ background:var(--surface-2); border:none; border-radius:50%; width:40px; height:40px; cursor:pointer; color:var(--ink-muted); flex:0 0 40px; display:grid; place-items:center; }
</style>

      missions:[
        missao("h1m2","h1","Um dia ouvindo minhas palavras",{tempo:"1 dia", cena:"\"Não tem jeito.\" \"Eu tenho que.\" \"Se ao menos o cliente mandasse no prazo…\" Essas frases saem quase sem a gente perceber, e dizem muito sobre quem está no comando.", desafio:"Durante um dia inteiro de trabalho, preste atenção às frases que você usa e às que escuta da equipe.", passos:["Escolha o dia e combine consigo logo cedo: hoje eu escuto.", "Ao longo do dia, só repare nas frases reativas, suas e da equipe: \"não posso\", \"tenho de\", \"se eu pudesse\". Não precisa anotar.", "Quando a frase for sua, tente reformular na hora: \"eu escolho\", \"eu prefiro\", \"vou ver o que dá para fazer\"."], perguntas:["Quais frases você mais ouviu ou disse ao longo do dia?", "Quando reformulou uma frase, o que mudou em você ou na conversa?", "O que te surpreendeu nesse exercício?"]}),
        missao("h1m3","h1","O problema que está me tirando o sono",{tempo:"10 min + 1 ação", cena:"Tem aquele problema que volta toda semana e consome energia só de pensar nele. A pergunta desta lição é simples: quanto dele está nas suas mãos?", desafio:"Escolha um problema real que esteja te frustrando e dê, ainda esta semana, o primeiro passo que depende de você.", passos:["Pense no problema e resuma em uma frase, para você mesmo(a).", "Classifique: depende só de mim, depende de influenciar alguém, ou não depende de mim?", "Defina o primeiro passo dentro do seu alcance, e faça."], perguntas:["Qual era o problema e como você o classificou?", "Que passo você deu e o que aconteceu depois?", "Como ficou sua energia em relação a esse problema?"]}),
        missao("h1m4","h1","Ensaio antes da cena",{tempo:"10 min + o momento real", cena:"Você já sabe como vai ser: a reunião de sempre, o cliente que liga irritado, a cobrança que te tira do sério. E já sabe como costuma reagir.", desafio:"Escolha uma situação que vai acontecer em breve e na qual você costuma reagir no automático. Ensaie, na imaginação, uma resposta diferente, e coloque em prática quando a hora chegar.", passos:["Pense na situação e lembre como você normalmente reage.", "Feche os olhos por alguns minutos e se veja respondendo com calma, a partir do que você valoriza.", "Na hora real, lembre da pausa: respire antes de responder."], perguntas:["Que situação você escolheu e como costuma reagir nela?", "Na hora real, conseguiu fazer a pausa? Como foi sua resposta?", "O que você leva dessa experiência para a próxima vez?"]}),
        missao("h1m5","h1","7 dias de proatividade",{tempo:"7 dias", cena:"Um dia mostra o caminho. Uma semana inteira mostra o que muda quando você escolhe agir.", desafio:"Durante 7 dias, cuide do que está no seu alcance: cumpra um pequeno compromisso por dia e troque a queixa pela pergunta \"o que eu posso fazer aqui?\".", passos:["Escolha um compromisso pequeno e diário que dependa só de você. Por exemplo: dar um retorno pendente por dia, ou não sair de uma reunião sem um próximo passo.", "Quando se pegar reclamando, pergunte: o que eu posso fazer aqui?", "No fim dos 7 dias, repare: o que mudou ao seu redor?"], perguntas:["Que compromisso você assumiu e em quantos dias conseguiu cumprir?", "Percebeu alguma mudança na forma como as pessoas reagem a você?", "O que ficou mais fácil ao longo da semana?"]})

var STORE_KEY = "circulo7:store:v3";
var store = null;
function defaultStore(){ return { myPage:0, diary:[], cases:{}, meetings:[], finalChallenge:null, bookNotes:"", chapterNotes:{}, readingNotes:{}, queuedBooks:null }; }
var STORAGE_OK = (function(){ try{ var k="__ep_test"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
function loadStore(){
  var raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ return defaultStore(); }
  if(!raw) return defaultStore();
  try{ return Object.assign(defaultStore(), JSON.parse(raw)); }
  catch(e){
    /* dados ilegíveis: guarda uma cópia antes de qualquer gravação nova, para não perder nada */
    try{ localStorage.setItem(STORE_KEY+":backup-"+Date.now(), raw); }catch(e2){}
    return defaultStore();
  }
}
var saveFailWarned = false;
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
  catch(e){ if(!saveFailWarned){ saveFailWarned = true; try{ showToast("Não foi possível salvar neste navegador. Abra o app pelo Chrome ou pelo Safari."); }catch(e2){} } }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s===0||s) ? String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;") : ""; }

/* mission "completion" = at least one diary entry references it */
function entriesForMission(missionId){ return (store.diary||[]).filter(function(e){ return e.missionId===missionId; }); }
function missionDone(missionId){ return entriesForMission(missionId).length > 0; }
function completedMissionsCount(habitId){
  var list = habitId ? BOOK.habits.find(function(h){return h.id===habitId;}).missions : ALL_MISSIONS;
  return list.filter(function(m){ return missionDone(m.id); }).length;
}
/* ---- hábito da semana: sem datas — avança quando o grupo avança ---- */
function weekHabit(){ return BOOK.habits.find(function(h){ return h.id===store.weekHabit; }) || BOOK.habits[0]; }
function weekEntries(h){
  var since = store.weekHabitSince ? new Date(store.weekHabitSince) : null;
  return (store.diary||[]).filter(function(e){ return e.missionId && (e.habits||[]).indexOf(h.id)>-1 && h.missions.some(function(m){return m.id===e.missionId;}) && (!since || (e.createdAt && new Date(e.createdAt) >= since)); });
}
function weekLessonsDone(h){ var ids = {}; weekEntries(h).forEach(function(e){ ids[e.missionId]=1; }); return Object.keys(ids).length; }
function weekPickMission(){ var h = weekHabit(); if(store.weekPick && store.weekPick.habit===h.id){ return h.missions.find(function(m){return m.id===store.weekPick.mission;}) || null; } return null; }
function setWeekHabit(id){ store.weekHabit = id; store.weekHabitSince = new Date().toISOString(); store.weekPick = null; saveStore(); }
function pickWeekLesson(mid){ var h = weekHabit(); store.weekPick = {habit:h.id, mission:mid}; saveStore(); }
function habitLived(h){ return completedMissionsCount(h.id) >= 1; }
function habitDeep(h){ return h.missions.length > 0 && completedMissionsCount(h.id) === h.missions.length; }
function habitsLivedCount(){ return BOOK.habits.filter(habitLived).length; }
function allHabitsLived(){ return habitsLivedCount() === BOOK.habits.length; }

/* arco dos 7 hábitos — mesmo desenho da marca: vivido = dourado, aprofundado = anel, destaque = pulso */
function habitArcSvg(opts){
  opts = opts || {};
  var w = 240, h = 88, cx = 120, cy = 104, r = 88, start = 200, end = 340, out = "";
  out += '<path class="arc-line" d="M'+(cx + r*Math.cos(start*Math.PI/180)).toFixed(1)+' '+(cy + r*Math.sin(start*Math.PI/180)).toFixed(1)+' A '+r+' '+r+' 0 0 1 '+(cx + r*Math.cos(end*Math.PI/180)).toFixed(1)+' '+(cy + r*Math.sin(end*Math.PI/180)).toFixed(1)+'"/>';
  BOOK.habits.forEach(function(hb, i){
    var t = i/(BOOK.habits.length-1), ang = (start + t*(end-start))*Math.PI/180;
    var x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
    var lived = habitLived(hb), deep = habitDeep(hb), hi = opts.highlight === hb.id;
    var cls = "arc-dot" + (lived ? " lived" : "") + (hi ? " hi" : "");
    if(deep) out += '<circle class="arc-ring" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="13"/>';
    if(hi) out += '<circle class="arc-pulse" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9"/>';
    out += '<circle class="'+cls+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="8"/>';
    out += '<text class="arc-num'+(lived?' on':'')+'" x="'+x.toFixed(1)+'" y="'+(y+3.6).toFixed(1)+'">'+hb.number+'</text>';
  });
  return '<svg class="habit-arc" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+habitsLivedCount()+' de '+BOOK.habits.length+' hábitos vividos">'+out+'</svg>';
}
function habitProgressPct(habit){ var total = habit.missions.length; if(!total) return 0; return Math.round(completedMissionsCount(habit.id)/total*100); }

/* ---- semanas (ciclo começa segunda 14h) e sequência ---- */
function cycleStartOf(d){ var back = (d.getDay()+6)%7; var m = new Date(d.getFullYear(), d.getMonth(), d.getDate()-back, 14, 0, 0); if(d < m) m.setDate(m.getDate()-7); return m; }
function weekKeyOf(d){ var m = cycleStartOf(d); return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0"); }
function activeWeeks(){
  var set = {};

  return set;
}
function currentStreak(){

function playChime(deep){
  /* som comemorativo: arpejo maior subindo + acorde final com brilho */
  try{
    var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    var ctx = playChime.ctx || (playChime.ctx = new AC());
    if(ctx.state === "suspended") ctx.resume();
    var master = ctx.createGain(); master.gain.value = deep ? 0.9 : 0.8; master.connect(ctx.destination);
    function tone(f, t, len, peak, type){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.05);
    }
    var t0 = ctx.currentTime + 0.05;
    var arp = deep ? [523.25, 659.25, 783.99, 1046.5, 1318.51] : [523.25, 659.25, 783.99, 1046.5];
    var step = deep ? 0.1 : 0.09;
    arp.forEach(function(f, i){ var t = t0 + i*step; tone(f, t, 0.45, 0.07, "triangle"); tone(f*2, t, 0.3, 0.015, "sine"); });
    var tc = t0 + arp.length*step + 0.02;
    var chord = deep ? [523.25, 659.25, 783.99, 1046.5, 1318.51] : [523.25, 659.25, 783.99, 1046.5];
    chord.forEach(function(f){ tone(f, tc, deep ? 2.2 : 1.6, 0.035, "sine"); tone(f, tc, deep ? 1.2 : 0.9, 0.012, "triangle"); });
    [2093, 2637, 3136].forEach(function(f, i){ tone(f, tc + 0.05 + i*0.07, 0.6, deep ? 0.012 : 0.008, "sine"); });
  }catch(e){}
}

function renderHabit(c, habitId, missionId){
  var h = BOOK.habits.find(function(x){return x.id===habitId;});
  if(missionId){ renderMissionDetail(c, missionId, function(){ go("estante", BOOK.id, {tab:"habitos", habitId:habitId}); }); return; }
  var html = '';
  html += '<button class="back" id="backMap">'+ICONS.back+' Hábitos</button>';
  html += '<p class="eyebrow">Hábito '+h.number+' de '+BOOK.habits.length+'</p>';
  html += '<h2 style="margin:4px 0 16px;font-size:1.28rem;">'+h.title+'</h2>';
  html += '<div class="panel stack" style="margin-bottom:16px;">';
  html += '  <div><p class="eyebrow" style="margin-bottom:6px;">Relembre</p><p style="line-height:1.6;">'+h.relembre+'</p></div>';
  html += '  <div><p class="eyebrow" style="margin-bottom:8px;">Conceitos essenciais</p><ul class="concept-list">'+h.conceitos.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';

function missionPathHtml(missions){
  var out = '<div class="mission-path">';
  missions.forEach(function(m, i){
    var done = missionDone(m.id), n = entriesForMission(m.id).length;
    out += '<div class="path-item '+(done?"done":"")+'"><button class="mission-card" data-mission="'+m.id+'"><div class="top-row"><span class="m-num">Lição '+String(i+1).padStart(2,"0")+'</span><span class="status-tag '+(done?"done":"n")+'">'+(done?("Registrada"+(n>1?" ("+n+")":"")):"Ainda não")+'</span></div><span class="m-title">'+m.name+'</span></button></div>';
  });
  out += '</div>';
  return out;
}
function wireMissionCards(c, habitId, customOpen){
  c.querySelectorAll("[data-mission]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(customOpen){ customOpen(btn.dataset.mission); return; }
      if(state.route === "estante") go("estante", BOOK.id, {tab:"habitos", habitId: habitId, missionId: btn.dataset.mission});
      else go("praticas", null, {tab:"missoes", missionId: btn.dataset.mission});
    });
  });
}

/* ---- mission detail: relembre / observe / experimente / [registrar] ---- */
function renderMissionDetail(c, missionId, onBack){
  var m = missionById(missionId), h = habitOf(missionId);
  var entries = entriesForMission(missionId);

  var html = '';
  html += '<button class="back" id="backMission">'+ICONS.back+' '+h.title+'</button>';
  html += '<div class="ms-head"><p class="eyebrow">Hábito '+h.number+' · '+h.title+'</p>';
  html += '<h2 class="ms-title">'+m.name+'</h2>';
  if(m.tempo) html += '<span class="ms-time">'+m.tempo+'</span>';
  html += '</div>';

  html += '<div class="panel stack ms-panel">';
  if(m.cena){
    html += '  <p class="ms-cena">'+m.cena+'</p>';
    html += '  <div class="ms-desafio"><p class="eyebrow gold">Seu desafio</p><p>'+m.desafio+'</p></div>';
    html += missionGuideHtml(m);
    html += '  <div><p class="eyebrow" style="margin-bottom:8px;">Como fazer</p><ol class="ms-steps">'+m.passos.map(function(p){ return '<li>'+p+'</li>'; }).join('')+'</ol></div>';
    html += '  <div class="ms-story"><p class="eyebrow">Conte como foi</p><p class="ms-story-lead">Depois de viver a lição, volte aqui. Estas são as perguntas:</p><ul>'+m.perguntas.map(function(q){ return '<li>'+q+'</li>'; }).join('')+'</ul></div>';
    html += '  <button class="btn primary" id="registerBtn">Contar como foi</button>';
    var isWeek = h.id === weekHabit().id, pk = weekPickMission();
    if(isWeek && !(pk && pk.id===m.id) && !entries.length) html += '  <button class="btn ghost" id="pickBtn">Escolher como minha lição da semana</button>';
    if(isWeek && pk && pk.id===m.id) html += '  <p class="ms-picked">✓ Esta é a sua lição da semana</p>';
    if(h.aplicacao) html += '  <p class="ms-fonte">Inspirada nas Sugestões de Aplicação do autor · '+h.aplicacao+'</p>';
  } else {
    html += '  <div><p class="eyebrow" style="margin-bottom:6px;">Relembre</p><p style="line-height:1.6;">'+m.relembre+'</p></div>';
    html += missionGuideHtml(m);
    html += '  <div class="callout"><b>Observe</b>'+m.observe+'</div>';
    html += '  <div class="callout gold"><b>Experimente</b>'+m.experimente+'</div>';
    html += '  <button class="btn primary" id="registerBtn">Registrar o que aconteceu</button>';
  }
  html += '</div>';

  if(m.cena && entries.length && h.id === weekHabit().id && weekLessonsDone(h) === 1){
    var rest = h.missions.filter(function(x){ return !missionDone(x.id); });
    if(rest.length){
      html += '<div class="invite"><p class="eyebrow gold">Indo mais fundo</p><p>Você viveu uma lição do Hábito '+h.number+'. Ainda dá tempo de mais uma antes do encontro. Que tal?</p><div class="invite-list">'+rest.map(function(x){ return '<button class="chip" data-goto="'+x.id+'">'+x.name+'</button>'; }).join('')+'</div></div>';
    }
  }
  if(entries.length){
    html += '<div class="section-title"><span class="eyebrow">Meus relatos desta lição</span></div>';
    html += '<div class="timeline">' + entries.slice().reverse().map(function(e){
      return '<div class="tl-entry"><span class="tl-date">'+formatDate(e.date)+'</span><div class="tl-body">'+(e.sentimento?'<span class="tl-tag">'+e.sentimento+'</span>':'')+'<p class="tl-quote">"'+esc((e.revelou||e.situacao||"").slice(0,140))+'"</p>'+'<div class="tl-actions"><button data-read="'+e.id+'">Ler</button><button data-edit="'+e.id+'">Editar</button></div></div></div>';
    }).join('') + '</div>';
  }

  c.innerHTML = html;
  c.querySelector("#backMission").addEventListener("click", onBack);
  var gm = c.querySelector("#guideMore");
  if(gm) gm.addEventListener("click", function(){ go("praticas", null, {tab:"consulta", h:h.id}); });
  var pb = c.querySelector("#pickBtn");
  if(pb) pb.addEventListener("click", function(){ pickWeekLesson(m.id); renderMissionDetail(c, missionId, onBack); });
  c.querySelectorAll("[data-read]").forEach(function(b){ b.addEventListener("click", function(){ openReadEntryModal(b.dataset.read); }); });
  c.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click", function(){ openEditEntryModal(b.dataset.edit); }); });
  c.querySelectorAll("[data-goto]").forEach(function(b){ b.addEventListener("click", function(){ go("praticas", null, {tab:"missoes", missionId:b.dataset.goto}); }); });
  c.querySelector("#registerBtn").addEventListener("click", function(){
    openExperienceWizard(missionId, function(){ renderMissionDetail(c, missionId, onBack); });
  });
}
function renderMissionModal(missionId, onClose){
  var div = document.createElement("div");
  renderMissionDetail(div, missionId, function(){ onClose(); });
  openModal(missionById(missionId).name, div.innerHTML);
  var mr = document.getElementById("modalRoot");
  mr.querySelector("#backMission").addEventListener("click", function(){ closeModal(); onClose(); });
  mr.querySelector("#registerBtn").addEventListener("click", function(){ openExperienceWizard(missionId, function(){ closeModal(); onClose(); }); });
}

      { t:"Três tipos de problema", d:"Problemas de controle direto envolvem o nosso próprio comportamento e se resolvem com mudança de hábito. Os de controle indireto envolvem o comportamento de outros e se resolvem com métodos de influência (exemplo, conversa, persuasão). Os sem controle algum, como o passado ou fatos consumados, pedem aceitação serena — mudar a postura diante deles." },
      { t:"\"Ter\" x \"Ser\"", d:"O Círculo de Preocupação está cheio de \"teres\": se eu tivesse um chefe melhor, se eu tivesse mais tempo, se a equipe fosse mais madura. O Círculo de Influência está cheio de \"seres\": eu posso ser mais paciente, mais organizado, mais claro. A mudança proativa começa por \"ser\"." },
      { t:"Fazer e cumprir compromissos", d:"O coração do Círculo de Influência é a capacidade de fazer promessas e cumpri-las, inclusive para si mesmo. Começar com compromissos pequenos e honrá-los constrói integridade pessoal e a confiança de que somos capazes de mudar." }
    ]
  },
  h2: {
    subtitulo: "Princípios da Liderança Pessoal", paginas: "A partir da p. 131",
    eyebrow: "Vitória particular",
    ideia: [
      "Começar com o objetivo em mente é ter clareza de para onde se está indo antes de dar o primeiro passo. É possível estar muito ocupado subindo uma escada e só no topo perceber que ela estava encostada na parede errada.",
      "Covey propõe um exercício marcante: imaginar o próprio velório e ouvir o que familiares, amigos, colegas e pessoas da comunidade diriam sobre você. O que você gostaria de ouvir revela seus valores mais profundos — e serve de critério para o que fazer hoje.",
      "Na prática, este hábito se traduz em uma declaração de missão pessoal: um texto que expressa quem você quer ser, o que quer fazer e quais princípios sustentam isso. Ele se torna a referência para decidir no meio da urgência."
    ],
    conceitos: [
      { t:"Tudo é criado duas vezes", d:"Toda realização passa por uma criação mental e só depois por uma física. Uma casa é desenhada antes de ser construída; uma reunião bem conduzida foi pensada antes de acontecer. Quando não fazemos a primeira criação de forma consciente, outras pessoas e as circunstâncias a fazem por nós." },
      { t:"Liderança antes de gestão", d:"Gestão é fazer as coisas do jeito certo — eficiência. Liderança é fazer as coisas certas — direção. Covey usa a imagem de uma equipe abrindo caminho na selva com eficiência máxima, enquanto o líder sobe numa árvore, olha em volta e grita: \"selva errada!\". Nenhuma eficiência compensa estar no lugar errado. O Hábito 2 é sobre liderança pessoal; o Hábito 3, sobre gestão pessoal." },
      { t:"Reescrever o roteiro", d:"Muitos de nós vivemos roteiros que recebemos de fora: da família, da cultura, das primeiras experiências profissionais. Usando autoconsciência e imaginação, podemos revisar esses roteiros e escolher novos, alinhados aos nossos valores. Um gestor que aprendeu que liderar é controlar pode reescrever esse roteiro para liderar desenvolvendo pessoas." },
      { t:"Declaração de missão pessoal", d:"É uma espécie de constituição pessoal: diz no que você quer se concentrar (caráter), o que quer realizar (contribuições) e em quais princípios isso se apoia. Não se escreve numa tarde; costuma levar semanas e passa por revisões. Ela funciona como critério: diante de uma escolha difícil, a pergunta passa a ser \"isso combina com a minha missão?\"." },
      { ref:"Ver também o Apêndice A, p. 399", t:"Centro de vida", d:"Todos temos um centro que orienta nossas decisões: trabalho, dinheiro, família, cônjuge, prazer, posses, amigos, inimigos, uma instituição ou nós mesmos. Cada centro distorce a visão a seu modo — quem é centrado no trabalho, por exemplo, mede o próprio valor pelo cargo. Covey propõe colocar princípios no centro, porque eles não mudam com o humor, o mercado ou as pessoas." },
      { t:"Quatro fatores de sustentação", d:"O centro escolhido determina quatro coisas: segurança (senso de valor e estabilidade), orientação (de onde vêm as direções), sabedoria (como enxergamos a vida e equilibramos as partes) e poder (capacidade de agir). Um centro baseado em princípios fortalece os quatro ao mesmo tempo." },
      { t:"Visualizar o legado desejado", d:"É o exercício do velório e, de forma mais ampla, a prática de imaginar o resultado final antes de agir: como deve terminar esta conversa, este projeto, este ano. Visualizar com detalhes ajuda a manter o rumo quando a rotina empurra para outra direção." },
      { t:"Papéis e metas", d:"Vivemos vários papéis: gestor, colega, pai ou mãe, filho, amigo, membro de uma comunidade. Uma missão equilibrada considera cada um deles e define metas para cada papel. Isso evita que um único papel, geralmente o trabalho, engula todos os outros." },
      { t:"Missão da equipe ou da organização", d:"O mesmo princípio vale para grupos. Uma missão que a equipe ajuda a construir gera compromisso; uma missão escrita só pela liderança e colada na parede gera indiferença. Covey resume: sem envolvimento, não há comprometimento." }
    ]
  },
  h3: {
    subtitulo: "Princípios do Gerenciamento Pessoal", paginas: "A partir da p. 187",
    eyebrow: "Vitória particular",
    ideia: [
      "Se o Hábito 2 é a primeira criação (decidir o que importa), o Hábito 3 é a segunda: colocar em prática, dia após dia. É o hábito da gestão pessoal — usar a vontade independente para organizar a vida em torno das prioridades, e não das pressões do momento.",
      "A ferramenta central é a matriz de gestão do tempo, que cruza duas perguntas: isto é urgente? isto é importante? O urgente pede ação imediata e grita por atenção. O importante contribui para a missão, os valores e as metas — e geralmente não grita.",
      "A grande virada está no Quadrante II: atividades importantes que não são urgentes, como planejar, prevenir problemas, desenvolver pessoas e cuidar de relacionamentos. Quanto mais tempo investido ali, menos incêndios aparecem no Quadrante I."
    ],
    conceitos: [
      { t:"Quadrante I — urgente e importante", d:"Crises, problemas que pressionam, prazos que vencem hoje. Precisa ser atendido, mas quem vive nele se esgota: apaga um incêndio e logo surge outro. Na contabilidade, é a obrigação que vence amanhã e ainda não foi conferida." },
      { t:"Quadrante II — importante, não urgente", d:"Planejamento, prevenção, construção de relacionamentos, capacitação da equipe, revisão de processos, descanso de verdade. Ninguém cobra essas atividades com urgência, por isso são sempre adiadas. É o quadrante da eficácia: investir aqui reduz o tamanho do Quadrante I." },
      { t:"Quadrante III — urgente, não importante", d:"Interrupções, muitas ligações e mensagens, reuniões sem propósito claro, pedidos que são prioridade para os outros, mas não para os seus objetivos. Parece importante porque é urgente. Quem vive aqui sente que está trabalhando muito, mas não avança no que importa." },
      { t:"Quadrante IV — nem urgente, nem importante", d:"Distrações, rolagem de redes sociais, tarefas inúteis, conversas que só passam o tempo. Pessoas eficazes evitam os Quadrantes III e IV, porque, urgentes ou não, eles não são importantes." },
      { t:"Foco no Quadrante II", d:"A pergunta de Covey é: qual atividade, se feita com regularidade, faria uma enorme diferença positiva na sua vida ou no seu trabalho? Quase sempre a resposta está no Quadrante II. O tempo para ela costuma vir dos Quadrantes III e IV — o Quadrante I não pode ser simplesmente ignorado." },
      { t:"Dizer não com um sim maior", d:"Para dizer sim ao importante, é preciso dizer não a outras coisas, inclusive a coisas boas. Isso fica mais fácil quando existe um \"sim\" maior ardendo por dentro: a clareza da missão e das prioridades. Um não educado e bem explicado vale mais que um sim que compromete o que importa." },
      { ref:"Ver também o Apêndice B, p. 411", t:"Organizar a semana, não o dia", d:"Planejar só o dia tende a priorizar o que está na agenda. Planejar a semana permite começar pelas prioridades. Covey sugere: identificar seus papéis, escolher uma ou duas metas importantes para cada papel na semana, reservar horários para elas na agenda e, no dia a dia, adaptar-se ao que aparecer sem perder de vista essas metas." },
      { t:"Delegação de tarefas x delegação de responsabilidade", d:"Delegar tarefas é dizer o que fazer e como fazer, passo a passo, e conferir tudo — o gestor continua sendo o gargalo. Delegar responsabilidade é combinar resultados e deixar a pessoa escolher o caminho. Covey conta como ensinou o filho de sete anos a cuidar do jardim combinando apenas o resultado: \"verde e limpo\". O filho escolheu como fazer e assumiu a responsabilidade." },
      { t:"Os cinco elementos de uma boa delegação", d:"1) Resultados desejados: o que se espera, não como fazer. 2) Diretrizes: limites e regras a respeitar. 3) Recursos: pessoas, ferramentas e apoio disponíveis. 4) Prestação de contas: como e quando os resultados serão avaliados. 5) Consequências: o que acontece se o resultado for ou não alcançado. Os mesmos elementos aparecem no acordo ganha-ganha do Hábito 4." },
      { t:"Delegar ou recusar o Quadrante III", d:"Boa parte do Quadrante III pode ser delegada a quem tem aquilo como prioridade, renegociada ou simplesmente recusada. Uma reunião recorrente que não decide nada pode virar um resumo por mensagem; uma demanda que é de outro setor pode voltar para lá com orientação." }
    ]
  },
  h4: {
    subtitulo: "Princípios da Liderança Interpessoal", paginas: "A partir da p. 255 · antes, leia Paradigmas da Interdependência, p. 231",
    eyebrow: "Vitória pública",
    ideia: [
      "Pensar ganha-ganha é uma filosofia de interação que busca benefício mútuo em todas as relações. Não se trata de técnica de negociação nem de ser bonzinho: é acreditar que existe espaço para todos e que o sucesso de um não precisa ser construído sobre o fracasso do outro.",
      "A maioria de nós foi educada na lógica ganha-perde: notas comparadas, competição entre irmãos, rankings. Covey reconhece que há situações competitivas reais, mas mostra que, no dia a dia de uma organização, quase tudo depende de cooperação — e a lógica ganha-perde corrói essa cooperação.",
      "O ganha-ganha exige caráter: integridade para cumprir o combinado, maturidade para equilibrar coragem e consideração, e mentalidade de abundância para acreditar que há o suficiente para todos."
    ],
    conceitos: [
      { t:"Os seis paradigmas de interação", d:"Ganha-ganha: as duas partes saem satisfeitas e comprometidas. Ganha-perde: eu venço, você perde — típico de quem usa posição, poder ou credenciais. Perde-ganha: cedo para evitar conflito e engulo a frustração, que reaparece depois. Perde-perde: quando dois ganha-perde se enfrentam e ambos preferem ver o outro perder. Ganha: só quero o meu, o resto não importa. Ganha-ganha ou não há acordo: se não encontrarmos algo bom para os dois, combinamos não fechar." },
      { t:"Coragem + consideração", d:"Maturidade, para Covey, é o equilíbrio entre coragem (defender as próprias ideias e necessidades) e consideração (levar em conta as ideias e necessidades do outro). Muita coragem e pouca consideração gera ganha-perde. Muita consideração e pouca coragem gera perde-ganha. As duas em nível alto geram ganha-ganha." },
      { t:"Mentalidade de abundância", d:"Quem pensa com mentalidade de escassez vê a vida como uma torta fixa: se alguém pega um pedaço maior, sobra menos para mim. Daí a dificuldade de dividir reconhecimento, informação e mérito — até se alegrar com o sucesso alheio é difícil. A mentalidade de abundância parte da ideia de que há o suficiente para todos e abre espaço para possibilidades novas." },
      { t:"As cinco dimensões do ganha-ganha", d:"O ganha-ganha depende de cinco coisas ligadas entre si: caráter (integridade, maturidade, abundância), relacionamentos (confiança, saldo positivo na Conta Bancária Emocional), acordos (expectativas claras), sistemas (a organização precisa recompensar a cooperação, não a disputa interna) e processos (o caminho usado para chegar ao acordo)." },
      { t:"Acordo de desempenho ganha-ganha", d:"Transforma expectativas implícitas em combinados claros, usando os mesmos cinco elementos da delegação: resultados desejados, diretrizes, recursos, prestação de contas e consequências. Com o acordo feito, a própria pessoa avalia o desempenho com base no que foi combinado, e o gestor deixa de ser fiscal para ser apoio." },
      { ref:"Paradigmas da Interdependência, p. 231", t:"Conta Bancária Emocional", d:"Mede a confiança em uma relação. Covey destaca seis grandes depósitos: compreender o que é importante para o outro, cuidar das pequenas gentilezas, cumprir compromissos, esclarecer expectativas, demonstrar integridade (inclusive sendo leal a quem não está presente) e pedir desculpas sinceras quando erramos. Retiradas acontecem no caminho inverso. Atenção: desculpas repetidas pelo mesmo erro deixam de ser depósito." },
      { t:"Sistemas que reforçam ou sabotam", d:"Não adianta pregar cooperação se o sistema premia a competição — por exemplo, rankings internos que fazem setores esconderem informação uns dos outros. Para o ganha-ganha durar, metas, reconhecimento e comunicação precisam apoiar o trabalho conjunto." },
      { t:"Ganha-ganha ou não há acordo", d:"Quando não aparece uma solução boa para os dois lados, a alternativa mais saudável é combinar que não haverá acordo agora — e preservar a relação. Ter essa opção de verdade traz liberdade: ninguém precisa manipular nem ceder contra a vontade. Funciona melhor no início de uma relação ou negociação." },
      { t:"Processo em quatro passos", d:"1) Ver o problema pelo ponto de vista do outro, buscando entender suas necessidades. 2) Identificar as questões-chave e preocupações envolvidas, não as posições. 3) Definir que resultados seriam plenamente aceitáveis para os dois. 4) Buscar novas opções para chegar a esses resultados. Os passos 1 e 4 dependem diretamente dos Hábitos 5 e 6." }
    ]
  },
  h5: {
    subtitulo: "Princípios da Comunicação Empática", paginas: "A partir da p. 291",
    eyebrow: "Vitória pública",
    ideia: [
      "Passamos anos aprendendo a ler, escrever e falar, e quase nenhum tempo aprendendo a ouvir. A maioria das pessoas escuta com a intenção de responder: enquanto o outro fala, já está preparando a própria resposta ou relacionando tudo à própria experiência.",
      "Covey compara essa atitude a um oftalmologista que, depois de ouvir rapidamente o paciente, tira os próprios óculos e os entrega dizendo: \"use estes, funcionam muito bem para mim\". O conselho pode até ser bom, mas não serve, porque não partiu de um diagnóstico.",
      "O hábito tem duas metades na ordem certa: primeiro compreender, com escuta empática; depois ser compreendido, apresentando as próprias ideias com clareza e coragem. Quando a pessoa se sente realmente compreendida, ela se abre para ouvir também."
    ],
    conceitos: [
      { t:"Níveis de escuta", d:"Covey descreve cinco níveis: ignorar (não ouvir de fato), fingir (\"aham, sei\"), escuta seletiva (só as partes que interessam), escuta atenta (presta atenção às palavras) e escuta empática (procura entender o ponto de vista e os sentimentos do outro). Só o último leva à verdadeira compreensão." },
      { t:"Escuta autobiográfica x empática", d:"Na escuta autobiográfica filtramos o que ouvimos pela nossa própria história. Isso aparece em quatro reações típicas: avaliar (concordar ou discordar), sondar (fazer perguntas a partir do nosso interesse), aconselhar (dar soluções a partir da nossa experiência) e interpretar (explicar os motivos do outro a partir dos nossos). A escuta empática suspende essas reações por um tempo para entrar no quadro de referência do outro." },
      { t:"Escuta empática", d:"É ouvir com a intenção de compreender, de verdade. Envolve as palavras, mas sobretudo os sentimentos e o significado por trás delas — a maior parte da comunicação está no tom e na expressão. Empatia não é concordar: é entender profundamente, emocional e intelectualmente, como o outro enxerga a situação." },
      { t:"Diagnosticar antes de prescrever", d:"Nenhum bom médico receita antes de examinar. Na gestão, dar feedback, propor solução ou tomar partido antes de entender a situação é prescrever sem diagnóstico. Além de errar mais, o gestor perde credibilidade: quem não se sentiu ouvido dificilmente aceita a orientação." },
      { t:"As etapas da escuta empática", d:"Covey propõe um desenvolvimento em etapas. 1) Repetir o conteúdo: ajuda a prestar atenção. 2) Reformular o conteúdo com suas palavras: mostra que você entendeu. 3) Refletir o sentimento: \"você parece frustrado com isso\". 4) Reformular o conteúdo e refletir o sentimento juntos: \"você está frustrado porque fez sua parte e ainda assim o prazo foi perdido\". Não é técnica de imitação: sem intenção sincera, soa artificial." },
      { t:"Quando usar", d:"Escuta empática toma tempo, mas muito menos do que corrigir mal-entendidos depois. Não é necessária em toda troca rápida. É indispensável quando há emoção envolvida, quando a confiança está baixa, quando o assunto é delicado ou quando você percebe que está prestes a dar um conselho sem saber o problema real." },
      { t:"Ser compreendido depois de compreender", d:"A segunda metade do hábito exige coragem para expor as próprias ideias. Covey retoma três elementos da retórica grega: ethos (credibilidade pessoal, seu caráter e o saldo da relação), pathos (sintonia com os sentimentos do outro) e logos (a lógica do argumento). Nessa ordem. Quem começa pela lógica, sem credibilidade e sem empatia, raramente convence." },
      { t:"Escuta como depósito", d:"Ouvir alguém com atenção genuína é um dos maiores depósitos na Conta Bancária Emocional. Por isso este hábito é um atalho para a confiança: muitas vezes a pessoa nem precisa que você resolva o problema, precisa se sentir ouvida para encontrar a solução sozinha." }
    ]
  },
  h6: {
    subtitulo: "Princípios de Cooperação Criativa", paginas: "A partir da p. 321",
    eyebrow: "Vitória pública",
    ideia: [
      "Sinergia significa que o todo é maior que a soma das partes. Duas tábuas pregadas juntas suportam muito mais do que cada uma separadamente. Em equipes, sinergia acontece quando pessoas diferentes, com confiança e abertura, chegam juntas a soluções que nenhuma delas teria encontrado sozinha.",
      "Este hábito é o fruto dos anteriores: exige segurança interna (Hábitos 1 a 3), disposição para buscar benefício mútuo (Hábito 4) e capacidade de compreender o outro de verdade (Hábito 5).",
      "A essência da sinergia é valorizar as diferenças. Quem acha que todos deveriam pensar como ele está desperdiçando a principal matéria-prima de uma equipe: pontos de vista que ele próprio não tem."
    ],
    conceitos: [
      { t:"Diferenças como matéria-prima", d:"Pessoas diferentes enxergam coisas diferentes. Covey usa uma ilustração ambígua em que uns veem uma moça e outros uma senhora: os dois estão certos, só olham de modos distintos. A pessoa que pensa \"se ela vê diferente de mim, preciso entender o que ela está vendo\" transforma diferença em vantagem." },
      { t:"Três níveis de comunicação", d:"A qualidade da comunicação depende de confiança e cooperação. Defensiva (baixa confiança): cada um se protege, cheio de cautelas, e o resultado costuma ser ganha-perde ou perde-perde. Respeitosa (confiança média): educada e cordial, mas sem abertura real; o resultado é compromisso. Sinérgica (alta confiança): as pessoas se arriscam, ouvem e criam, e o resultado é ganha-ganha — muitas vezes melhor que o plano inicial de qualquer um." },
      { t:"Sinergia x compromisso", d:"No compromisso, cada lado cede um pouco: 1 + 1 vira 1,5. Ninguém sai muito mal, mas ninguém sai entusiasmado. Na sinergia, 1 + 1 pode ser 8, 16 ou 1.600, porque surge algo novo. Compromisso não é ruim, mas é um resultado médio; a sinergia busca o resultado excelente." },
      { t:"Terceira alternativa", d:"Diante de um impasse entre a minha ideia e a sua, a pergunta sinérgica é: existe uma terceira opção, melhor que as duas? Covey dá o exemplo de um casal dividido entre uma viagem de pesca e uma visita à mãe doente; após ouvir de verdade as razões de cada um, encontram uma solução que atende melhor os dois do que qualquer das propostas originais." },
      { t:"Análise do campo de forças", d:"Ideia do psicólogo Kurt Lewin: toda situação está em equilíbrio entre forças impulsoras (que empurram para a mudança: metas, incentivos, oportunidades) e forças restritivas (que travam: medo, cansaço, desconfiança, hábitos). Aumentar só a pressão gera resistência. Sinergia trabalha diretamente nas forças restritivas, conversando sobre elas abertamente, e as transforma em impulso." },
      { t:"Comunicação de alta confiança", d:"Sinergia só aparece com segurança para falar o que se pensa sem ser ridicularizado ou punido. O gestor cria esse ambiente sendo o primeiro a ouvir, a admitir que não sabe tudo e a valorizar quem traz uma visão diferente. A confiança é construída antes, na Conta Bancária Emocional, e não no meio da crise." },
      { t:"Sinergia consigo mesmo e com a natureza", d:"Covey lembra que a sinergia também pode acontecer dentro de nós, integrando razão e intuição, lógica e criatividade. E aponta a natureza como modelo: tudo nela está interligado e funciona em cooperação." },
      { t:"Quando não há abertura", d:"Mesmo em ambientes pouco sinérgicos, é possível praticar. Dá para buscar sinergia internamente, valorizar o lado bom de quem pensa diferente e procurar a terceira alternativa no próprio Círculo de Influência. Uma única pessoa que age assim pode mudar o clima de uma reunião." }
    ]
  },
  h7: {
    subtitulo: "Princípios de Autorrenovação Equilibrada", paginas: "A partir da p. 349 · fechamento em Novamente de Dentro para Fora, p. 373",
    eyebrow: "Renovação",
    ideia: [
      "Covey conta a história de um homem que serra uma árvore há horas, exausto e cada vez mais lento. Alguém sugere que ele pare para afiar a serra, e ele responde que não tem tempo, porque está ocupado serrando. Afinar o instrumento é justamente isso: parar para renovar a ferramenta mais importante que temos — nós mesmos.",
      "É um hábito do Quadrante II por excelência: importante, nunca urgente. Por isso é o primeiro a ser sacrificado quando a agenda aperta. E é ele que garante a capacidade de produção (o CP do equilíbrio P/CP) para sustentar os outros seis hábitos ao longo do tempo.",
      "A renovação equilibrada envolve quatro dimensões da natureza humana. Covey sugere reservar diariamente cerca de uma hora para trabalhar nelas — a chamada vitória particular diária."
    ],
    conceitos: [
      { t:"Dimensão física", d:"Cuidar bem do corpo: alimentação, descanso, relaxamento e exercício regular. Covey destaca exercícios de resistência, flexibilidade e força, feitos com constância e sem exageros. Quem está cansado e sem energia tem menos paciência, menos clareza e menos capacidade de escolher a resposta (Hábito 1)." },
      { t:"Dimensão espiritual", d:"É o centro do sistema de valores, a fonte de sentido e propósito. Cada pessoa a renova de um modo: oração, meditação, leitura inspiradora, contato com a natureza, música, reflexão sobre a missão pessoal. Ela alimenta diretamente o Hábito 2." },
      { t:"Dimensão mental", d:"Continuar aprendendo depois da escola: ler bons livros, escrever (um diário, por exemplo), estudar, planejar, organizar ideias. Covey critica o excesso de distrações passivas que entorpecem a mente. Ler e discutir um livro em grupo, como fazemos no EntrePáginas, é renovação mental na prática. Alimenta o Hábito 3." },
      { t:"Dimensão social/emocional", d:"Diferente das outras, não depende de um horário separado: renova-se nas relações do dia a dia. Toda interação é uma chance de praticar compreensão, ganha-ganha e sinergia (Hábitos 4, 5 e 6). Segurança emocional vem de dentro e se fortalece ajudando e servindo aos outros." },
      { t:"Renovação sustenta produtividade", d:"Produzir sem renovar esgota pessoas e equipes, como a galinha dos ovos de ouro sacrificada. Pausas reais, desenvolvimento e cuidado com a saúde não competem com os resultados: são o que permite que os resultados continuem vindo." },

function renderConsultaTab(c, current){

    out += '</dl></section>';
    if(h) out += '<button class="btn ghost sm" id="consToMissions">Ver as lições do Hábito '+h.number+' '+ICONS.chevron+'</button>';
    else out += '<button class="btn ghost sm" id="consNext">Ir para o Hábito 1 '+ICONS.chevron+'</button>';

    var body = document.getElementById("consBody");

    var b1 = document.getElementById("consToMissions");
    if(b1) b1.addEventListener("click", function(){ go("praticas", null, {tab:"missoes", h:k}); });

function weekCardHtml(){
  var h = weekHabit(), done = weekLessonsDone(h), pick = weekPickMission();
  var idx = BOOK.habits.indexOf(h), next = BOOK.habits[idx+1];
  var doneIds = {}; weekEntries(h).forEach(function(e){ doneIds[e.missionId]=1; });
  var html = '<div class="week-card"><span class="eyebrow gold">Hábito da semana</span>';
  html += '<h3 class="wk-title">Hábito '+h.number+' · '+h.title+'</h3>';
  if(done === 0) html += '<p class="wk-lead">Escolha a lição que mais combina com o seu momento e, se quiser, vá mais fundo com as outras.</p>';
  else if(done === 1) html += '<p class="wk-lead wk-invite"><b>Você viveu uma lição deste hábito.</b> Ainda dá tempo de mais uma antes do encontro. Que tal ir mais fundo?</p>';
  else html += '<p class="wk-lead wk-deep"><b>Indo mais fundo:</b> '+done+' lições deste hábito nesta semana.</p>';
  html += '<div class="wk-list">';
  h.missions.forEach(function(m){
    var tag = doneIds[m.id] ? '<span class="status-tag done">Vivida</span>' : ((pick && pick.id===m.id) ? '<span class="status-tag pick">Minha lição</span>' : '');
    html += '<button class="wk-item'+((pick && pick.id===m.id)?' picked':'')+'" data-wk="'+m.id+'"><span class="wk-item-t">'+m.name+'</span><span class="wk-item-m">'+(m.tempo||'')+'</span>'+tag+'</button>';
  });
  html += '</div>';
  html += '<div class="wk-advance" id="wkAdvance">';
  if(next) html += '<button class="btn ghost sm" id="wkAdvBtn">Nosso encontro aconteceu · ir para o Hábito '+next.number+' '+ICONS.chevron+'</button>';
  else html += '<p class="muted" style="font-size:.8rem;">Este é o último hábito do livro.</p>';
  html += '<details class="wk-manual"><summary>O grupo está em outro hábito?</summary><div class="chip-group" style="margin-top:10px;">'+BOOK.habits.map(function(x){ return '<button type="button" class="chip" data-sethab="'+x.id+'" aria-pressed="'+(x.id===h.id)+'">Hábito '+x.number+'</button>'; }).join('')+'</div></details>';
  html += '</div></div>';
  return html;
}

/* ============================= EXPERIÊNCIA (wizard em etapas → Diário) ============================= */
var QUICK_STEPS = [ {key:"situacao", q:"O que aconteceu e o que você percebeu?"} ];
var WIZ_STEPS = [
  {key:"situacao", q:"O que aconteceu?"},
  {key:"reacao", q:"Como você normalmente reagiria?"},
  {key:"diferente", q:"O que escolheu fazer diferente?"},
  {key:"depois", q:"O que aconteceu depois?"},
  {key:"revelou", q:"O que essa experiência revelou sobre sua forma de liderar?"},
  {key:"novamente", q:"Se acontecesse novamente, faria algo diferente?"}
];
var SENTIMENTOS = ["Difícil","Desafiador","Tranquilo","Transformador"];
function openMissionStory(mission, onDone){
  var habit = habitOf(mission.id), saving = false;
  var feeling = "";
  var body = '<p class="ms-cena" style="font-size:.95rem;margin-bottom:14px;">'+mission.desafio+'</p><div class="stack">';
  mission.perguntas.forEach(function(q, i){
    body += '<label class="field">'+q+'<textarea id="stQ'+i+'"></textarea></label>';
  });
  body += '<p class="mic-hint">🎤 Prefere falar? Toque no microfone do teclado e fale. Pode responder só o que fizer sentido.</p>';
  body += '<div><p class="field" style="margin-bottom:8px;">Como foi para você?</p><div class="chip-group" id="stFeel">'+SENTIMENTOS.map(function(f){ return '<button type="button" class="chip" data-f="'+f+'" aria-pressed="false">'+f+'</button>'; }).join('')+'</div></div>';
  body += '<p class="muted" style="font-size:.76rem;">Fica salvo no seu celular. Leve o seu relato para o encontro de terça.</p>';
  body += '<p class="st-error" id="stError" hidden>Escreva pelo menos uma resposta antes de salvar.</p>';
  body += '<button class="btn primary" id="stSave">Salvar meu relato</button></div>';
  openModal(mission.name, body);
  document.querySelectorAll("#stFeel [data-f]").forEach(function(b){
    b.addEventListener("click", function(){
      feeling = (feeling === b.dataset.f) ? "" : b.dataset.f;
      document.querySelectorAll("#stFeel [data-f]").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.f===feeling); });
    });
  });
  document.getElementById("stSave").addEventListener("click", function(){
    var respostas = mission.perguntas.map(function(q, i){ return {q:q, a:(val("stQ"+i)||"").trim()}; });
    var filled = respostas.filter(function(r){ return r.a; });
    if(!filled.length){ document.getElementById("stError").hidden = false; return; }
    if(saving) return; saving = true;
    var wasDone = missionDone(mission.id);
    if(habit.id === weekHabit().id && !weekPickMission()) store.weekPick = {habit:habit.id, mission:mission.id};
    var record = { id: uid(), story: true, date: todayLocalIso(), createdAt: new Date().toISOString(), missionId: mission.id, habits: [habit.id],
      respostas: respostas, sentimento: feeling,
      situacao: filled[0].a, revelou: filled[filled.length-1].a,
      share: true };
    store.diary = store.diary || [];
    store.diary.push(record);
    saveStore(); closeModal();
    if(onDone) onDone(); else if(state.route!=="estante" && state.route!=="praticas") renderApp();
    celebrateRecord(habit.id, wasDone);
  });
}
function openExperienceWizard(missionId, onDone){
  var mission = missionId ? missionById(missionId) : null;
  if(mission && mission.perguntas){ openMissionStory(mission, onDone); return; }
  var habit = mission ? habitOf(missionId) : null;
  var needsHabitPick = !mission;
  var answers = {};
  var pickedHabits = [];
  var idx = needsHabitPick ? -1 : 0; // -1 = habit-pick step, then 0..5

  var mode = store.wizMode === "completo" ? "completo" : "rapido";
  function steps(){ return mode === "rapido" ? QUICK_STEPS : WIZ_STEPS; }
  function totalSteps(){ return needsHabitPick ? steps().length+1 : steps().length; }
  function stepPos(){ return needsHabitPick ? idx+2 : idx+1; }

  function paint(){
    var dots = "";
    for(var i=0;i<totalSteps();i++){ dots += '<i class="'+(i < stepPos() ? "on" : "")+'"></i>'; }
    var body = '<div class="wiz-progress">'+dots+'</div>';
    body += '<p class="wiz-step-label">Etapa '+stepPos()+' de '+totalSteps()+'</p>';

    if(idx === -1){
      var chips = BOOK.habits.map(function(h){ return '<button type="button" class="chip" data-ch="'+h.id+'" aria-pressed="'+(pickedHabits.indexOf(h.id)>-1)+'">Háb. '+h.number+'</button>'; }).join('');
      body += '<label class="field">Quais hábitos você identifica nessa situação?</label><div class="chip-group" id="wizChips">'+chips+'</div>';
    } else {
      var step = steps()[idx];
      if(idx === 0){ body += '<div class="mode-switch" id="wizMode"><button type="button" data-mode="rapido" aria-pressed="'+(mode==="rapido")+'">Rápido · 1 pergunta</button><button type="button" data-mode="completo" aria-pressed="'+(mode==="completo")+'">Completo · 6 perguntas</button></div>'; }
      body += '<label class="field">'+step.q+'<textarea id="wizArea" autofocus>'+esc(answers[step.key])+'</textarea></label><p class="mic-hint">🎤 Prefere falar? Toque no microfone do teclado e fale — o texto aparece sozinho.</p>'; 
    }

    var isLast = idx === steps().length-1;
    body += '<div class="wiz-nav">';
    body += (stepPos()>1) ? '<button class="btn ghost" id="wizBack">Voltar</button>' : '<span></span>';
    if(isLast){
      body += '<button class="btn primary" id="wizFinishBtn">Salvar no meu diário</button>';
    } else {
      body += '<button class="btn primary" id="wizNext">'+(idx===-1 ? "Continuar" : "Próxima")+' '+ICONS.chevron+'</button>';
    }
    body += '</div>';
    if(isLast){
      body += '<p class="muted" style="font-size:.76rem;margin-top:14px;">Fica salvo no seu celular. Leve o seu relato para o encontro de terça.</p>';
    }

    openModal(mission ? mission.name : "Registrar uma experiência", body);

    if(idx===-1){
      document.querySelectorAll("#wizChips [data-ch]").forEach(function(chip){
        chip.addEventListener("click", function(){
          var id = chip.dataset.ch, i2 = pickedHabits.indexOf(id);
          if(i2>-1){ pickedHabits.splice(i2,1); chip.setAttribute("aria-pressed","false"); } else { pickedHabits.push(id); chip.setAttribute("aria-pressed","true"); }
        });
      });
    } else {
      document.getElementById("wizArea").focus();
    }
    document.querySelectorAll("#wizMode [data-mode]").forEach(function(b){
      b.addEventListener("click", function(){ saveCurrent(); mode = b.dataset.mode; store.wizMode = mode; saveStore(); paint(); });
    });
    var backBtn = document.getElementById("wizBack");
    if(backBtn) backBtn.addEventListener("click", function(){ saveCurrent(); idx--; paint(); });
    var nextBtn = document.getElementById("wizNext");
    if(nextBtn) nextBtn.addEventListener("click", function(){ saveCurrent(); idx++; paint(); });
    var finishBtn = document.getElementById("wizFinishBtn");
    if(finishBtn) finishBtn.addEventListener("click", function(){
      saveCurrent();
      var record = { id: uid(), quick: mode==="rapido", date: todayLocalIso(), createdAt: new Date().toISOString(), missionId: missionId || "", habits: habit ? [habit.id] : pickedHabits,
        situacao: answers.situacao||"", reacao: answers.reacao||"", diferente: answers.diferente||"", depois: answers.depois||"", revelou: answers.revelou||"", novamente: answers.novamente||"",
        share: true };
      store.diary = store.diary || [];
      store.diary.push(record);
      saveStore(); closeModal();
      if(onDone) onDone(); else if(state.route!=="estante" && state.route!=="praticas") renderApp();
      celebrateRecord();
    });
  }
  function saveCurrent(){
    if(idx>=0){ var step = steps()[idx]; var el = document.getElementById("wizArea"); if(el) answers[step.key] = el.value; }
  }
  paint();
}
